name: smart_tv_display
description: "Smart TV Display App for FireStick - Clean Architecture Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  bloc: ^8.1.0
  get_it: ^7.6.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # API & Networking
  dio: ^5.3.1
  retrofit: ^4.0.0+1
  json_serializable: ^6.7.1

  # Video & Media
  video_player: ^2.8.1
  cached_network_image: ^3.3.0
  carousel_slider: ^4.2.1
  chewie: ^1.7.4

  # Date & Time
  intl: ^0.19.0

  # Weather & News (mockable)
  http: ^1.1.0

  # Security
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # UI/UX
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_animate: ^4.2.0+1

  # Device Info
  device_info_plus: ^10.1.0
  platform_device_id: ^1.0.1

  # Background Tasks
  workmanager: ^0.5.2
  background_fetch: ^1.4.1

  # WebSocket
  web_socket_channel: ^2.4.0

  # Logging
  logger: ^2.1.0

  # File Picker
  file_picker: ^6.1.1
  image_picker: ^1.0.4

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_linter: ^2.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.6
  retrofit_generator: ^8.0.0
  hive_generator: ^2.0.1

flutte:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
